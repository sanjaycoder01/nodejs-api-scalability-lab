services:
  mongo:
    image: mongo:7
    container_name: mongo-lab
    ports:
      - "27017:27017"
    volumes:
      - mongo-lab-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mongo-lab-data:
